name: publish

on:
  push:
    tags:
      - "v*"
      - "prebuild-test.*"

jobs:
  # ===========================================================================
  # macOS builds (native runners for each arch + universal binary creation)
  # ===========================================================================
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-latest  # Apple Silicon
            zig_target: aarch64-macos
          - arch: x86_64
            runner: macos-13      # Intel
            zig_target: x86_64-macos
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            zig/.zig-cache
            ~/.cache/zig
          key: zig-release-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('zig/build.zig', 'zig/build.zig.zon') }}
          restore-keys: |
            zig-release-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build
        working-directory: zig
        run: |
          nix run nixpkgs#zig -- build -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseFast
          # Rename for clarity
          mv zig-out/lib/libcrsqlite.dylib zig-out/lib/crsqlite-darwin-${{ matrix.arch }}.dylib

      - name: Package artifact
        working-directory: zig
        run: |
          cd zig-out/lib
          zip crsqlite-darwin-${{ matrix.arch }}.zip crsqlite-darwin-${{ matrix.arch }}.dylib

      - name: Upload build artifact (for universal binary job)
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: zig/zig-out/lib/crsqlite-darwin-${{ matrix.arch }}.dylib
          retention-days: 1

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: zig/zig-out/lib/crsqlite-darwin-${{ matrix.arch }}.zip
          asset_name: crsqlite-darwin-${{ matrix.arch }}.zip
          tag: ${{ github.ref }}

  # Create macOS universal binary from the two arch-specific builds
  build-macos-universal:
    name: Build macOS Universal
    runs-on: macos-latest
    needs: build-macos
    steps:
      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-aarch64
          path: artifacts/aarch64

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64
          path: artifacts/x86_64

      - name: Create universal binary
        run: |
          mkdir -p output
          lipo -create \
            artifacts/aarch64/crsqlite-darwin-aarch64.dylib \
            artifacts/x86_64/crsqlite-darwin-x86_64.dylib \
            -output output/crsqlite-darwin-universal.dylib
          lipo -info output/crsqlite-darwin-universal.dylib
          cd output && zip crsqlite-darwin-universal.zip crsqlite-darwin-universal.dylib

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: output/crsqlite-darwin-universal.zip
          asset_name: crsqlite-darwin-universal.zip
          tag: ${{ github.ref }}

  # ===========================================================================
  # Linux builds (cross-compile from ubuntu using Zig)
  # ===========================================================================
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            zig_target: x86_64-linux-gnu
          - arch: aarch64
            zig_target: aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            zig/.zig-cache
            ~/.cache/zig
          key: zig-release-linux-${{ matrix.arch }}-${{ hashFiles('zig/build.zig', 'zig/build.zig.zon') }}
          restore-keys: |
            zig-release-linux-${{ matrix.arch }}-

      - name: Build
        working-directory: zig
        run: |
          nix run nixpkgs#zig -- build -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseFast
          # Rename for clarity
          mv zig-out/lib/libcrsqlite.so zig-out/lib/crsqlite-linux-${{ matrix.arch }}.so

      - name: Package artifact
        working-directory: zig
        run: |
          cd zig-out/lib
          zip crsqlite-linux-${{ matrix.arch }}.zip crsqlite-linux-${{ matrix.arch }}.so

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: zig/zig-out/lib/crsqlite-linux-${{ matrix.arch }}.zip
          asset_name: crsqlite-linux-${{ matrix.arch }}.zip
          tag: ${{ github.ref }}

  # ===========================================================================
  # WASM build
  # ===========================================================================
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            zig/.zig-cache
            ~/.cache/zig
          key: zig-release-wasm-${{ hashFiles('zig/build.zig', 'zig/build.zig.zon') }}
          restore-keys: |
            zig-release-wasm-

      - name: Build WASM
        working-directory: zig
        run: nix run nixpkgs#zig -- build wasm -Doptimize=ReleaseFast

      - name: Package artifact
        working-directory: zig
        run: |
          cd zig-out/lib
          # Package both static lib and wasm object
          zip crsqlite-wasm.zip libcrsqlite.a crsqlite.wasm

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: zig/zig-out/lib/crsqlite-wasm.zip
          asset_name: crsqlite-wasm.zip
          tag: ${{ github.ref }}

  # ===========================================================================
  # Size report (informational, runs after all builds complete)
  # ===========================================================================
  size-report:
    name: Size Report
    runs-on: ubuntu-latest
    needs: [build-macos, build-macos-universal, build-linux, build-wasm]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Report sizes
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo "  CR-SQLite Zig Build Size Report"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          find artifacts -type f \( -name "*.dylib" -o -name "*.so" -o -name "*.wasm" -o -name "*.a" \) | while read f; do
            SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            SIZE_KB=$(echo "scale=1; $SIZE / 1024" | bc)
            echo "  $(basename $f): ${SIZE_KB} KB (${SIZE} bytes)"
          done
          echo ""
